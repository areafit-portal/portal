<!DOCTYPE html>
<html lang="es">
<head>
<title>Mi portal · Areafit</title>
<meta name="theme-color" content="#111418">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14181F; --ink-2: #3D4754; --muted: #5B6573; --line: #E3E7EC; --bg: #F4F6F8; --card: #FFFFFF; --top: #111418;
    --brand: #0D4F7A; --brand-soft: #E3F1F8; --sky: #29A8E0; --ok: #1E6B3D; --ok-bg: #DDF0E1; --warn: #8A5A00; --warn-bg: #FFF1D6; --err: #B42318; --err-bg: #FDE2E0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 30; background: var(--top); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
  .burger { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .burger:active { background: #262B33; }
  .top img, .top .logo { height: 20px; width: auto; display: block; }
  .top .ttl { margin-left: auto; font-size: 13px; color: var(--sky); font-weight: 600; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 21px; margin: 4px 0 4px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--ink-2); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.block { width: 100%; }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .btn:disabled { opacity: .55; }
  .input { width: 100%; min-height: 46px; border: 1px solid #CBD3DC; border-radius: 10px; padding: 0 12px; background: #fff; font-size: 16px; }
  textarea.input { padding: 10px 12px; min-height: 80px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .pill { display: inline-block; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.err { background: var(--err-bg); color: var(--err); } .pill.off { background: #EEF1F4; color: var(--muted); }
  .banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 10px; line-height: 1.45; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); } .banner.err { background: var(--err-bg); color: var(--err); }
  .banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.info { background: var(--brand-soft); color: var(--brand); }
  /* Menú lateral */
  .scrim { position: fixed; inset: 0; background: rgba(17,20,24,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(290px, 84vw); background: #fff; z-index: 41; transform: translateX(-102%); transition: transform .2s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  body.menu .scrim { opacity: 1; pointer-events: auto; } body.menu .drawer { transform: none; }
  .dhead { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .dhead b { display: block; font-size: 16px; } .dhead span { font-size: 13px; color: var(--muted); }
  .dnav { padding: 8px; flex: 1; overflow: auto; }
  .dnav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; text-align: left; padding: 13px 12px; border-radius: 10px; font-weight: 500; cursor: pointer; }
  .dnav button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .dnav .ic { width: 22px; text-align: center; font-size: 17px; }
  .dnav .badge { margin-left: auto; background: var(--err); color: #fff; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
  .dfoot { padding: 10px 8px 18px; border-top: 1px solid var(--line); }
  /* Turnos compactos */
  .shift { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #F0F2F5; }
  .shift:first-of-type { border-top: 0; }
  .sbar { width: 5px; align-self: stretch; border-radius: 4px; flex: none; }
  .stime { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .swhat { color: var(--ink-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .dayh { display: flex; align-items: baseline; justify-content: space-between; margin: 12px 0 2px; }
  .dayh b { font-size: 14px; } .dayh span { font-size: 12px; color: var(--muted); }
  .free { font-size: 13px; color: var(--ok); padding: 6px 0; }
  .festd { font-size: 13px; background: #FFF1B8; color: #6B4E00; border-radius: 8px; padding: 7px 10px; margin: 4px 0; }
  .pfest { display: inline-block; background: #E0A800; color: #14181F; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi span { display: block; font-size: 12px; color: var(--muted); } .kpi b { font-size: 24px; } .kpi small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .list-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  .list-item .grow { flex: 1; min-width: 0; }
  .list-item b { display: block; font-size: 14px; }
  .chev { color: var(--muted); font-size: 20px; }
  .frame { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
  .frame iframe { border: 0; width: 794px; height: 1060px; display: block; transform-origin: 0 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .kv span { color: var(--muted); }
  .loading { text-align: center; padding: 40px 10px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #111418; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: 92vw; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .toast.err { background: var(--err); }
  .hidden { display: none !important; }
  .login { max-width: 420px; margin: 8vh auto 0; }
  .filebtn { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border: 1.5px dashed #9AA8B8; border-radius: 11px; background: #F8FAFB; cursor: pointer; font-weight: 500; font-size: 14px; }
  .filebtn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .filebtn .fic { font-size: 18px; }
  .req { color: var(--err); font-weight: 600; font-size: 12px; }
  .codein { font-size: 24px; letter-spacing: 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .docbox { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; -webkit-overflow-scrolling: touch; }
  .pdfpage { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.15); background: #fff; }
  .pad { width: 100%; height: 190px; border: 1.5px dashed #9AA8B8; border-radius: 10px; background: #FBFCFD; touch-action: none; display: block; }
  .check2 { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-size: 14px; }
  .check2 input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--brand); }
  .docrow { padding: 12px 14px; }
  .mdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
</style>
</head>

  function dayOfWeek(a, s, d) { const x = new Date(mondayOf(a, s).getTime() + d * 864e5); return new Date(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); }
  function wtag(s) { return 'S' + String(s).padStart(2, '0'); }
  function weekRange(a, s) { const x = dayOfWeek(a, s, 0), y = dayOfWeek(a, s, 6); return x.getDate() + ' ' + MESES[x.getMonth()] + ' – ' + y.getDate() + ' ' + MESES[y.getMonth()]; }
  function motivo(id) { return (S.d.motivos || []).find((m) => m.id === id) || { nombre: 'Ausencia', color: '#9AA4B1', unidad: 'DIAS' }; }
  function pillEstado(e) { return { PENDIENTE: '<span class="pill warn">Pendiente</span>', APROBADA: '<span class="pill ok">Aprobada</span>', RECHAZADA: '<span class="pill err">No aprobada</span>', ANULADA: '<span class="pill off">Anulada</span>' }[e] || ''; }

  /* ---------- Turnos ---------- */
  /** Turnos por fecha (aaaa-mm-dd) de las semanas con detalle. */
  function shiftsByDate() {
    const map = {};
    (S.d.horarios || []).forEach((w) => {
      (w.items || []).forEach((it) => {
        if (it[1] < 0) return; // marca de día festivo
        const k = iso(dayOfWeek(w.anio, w.semana, it[0]));
        (map[k] = map[k] || []).push({ a: it[1], b: it[2], n: it[3], c: it[4] });
      });
    });
    Object.keys(map).forEach((k) => map[k].sort((x, y) => x.a - y.a));
    return map;
  }
  function shiftRows(list) {
    return list.map((s) => '<div class="shift"><span class="sbar" style="background:' + esc(s.c || '#9AA4B1') + '"></span><span class="stime">' + t2(s.a) + ' – ' + t2(s.b) + '</span><span class="swhat">' + esc(s.n) + '</span></div>').join('');
  }
  function weekDays(w) {
    const by = [[], [], [], [], [], [], []], fest = {};
    (w.items || []).forEach((it) => { if (it[1] < 0) fest[it[0]] = it[3]; else by[it[0]].push({ a: it[1], b: it[2], n: it[3], c: it[4] }); });
    return by.map((l, d) => {
      const dt = dayOfWeek(w.anio, w.semana, d);
      const h = l.reduce((t, s) => t + (s.b - s.a) / 60, 0);
      const f = fest[d];
      return '<div class="dayh"><b>' + DIAS[d] + ' ' + dt.getDate() + (f ? '<span class="pfest">Festivo</span>' : '') + '</b><span>' + (h ? fmtH(h) + ' h' : '') + '</span></div>' +
        (f ? '<div class="festd">' + esc(f) + (l.length ? '. Vienes a trabajar: estas horas se te pagan aparte como horas festivas.' : ': no vienes, descansa.') + '</div>' : '') +
        (l.length ? shiftRows(l.sort((x, y) => x.a - y.a)) : (f ? '' : '<div class="free">Libre</div>'));
    }).join('');
  }

  function vInicio() {
    const d = S.d, me = d.me, today = new Date();
    const map = shiftsByDate();
    const hoyK = iso(today), now = today.getHours() * 60 + today.getMinutes();
    const hoy = (map[hoyK] || []).filter((s) => s.b > now);
    // Próximo día con turno (a partir de mañana)
    let next = null, nextK = '';
    for (let i = 1; i <= 14 && !next; i++) { const dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i); const k = iso(dt); if (map[k] && map[k].length) { next = map[k]; nextK = k; } }
    const wk = d.horarios.find((w) => { const a = dayOfWeek(w.anio, w.semana, 0), b = dayOfWeek(w.anio, w.semana, 6); return a <= today && today < new Date(b.getTime() + 864e5); });
    const weekH = wk && wk.items ? wk.items.reduce((t, it) => t + (it[2] - it[1]) / 60, 0) : null;
    const sinFirmar = d.horarios.filter((w) => !w.firmado);
    const resueltas = d.solicitudes.filter((s) => (s.estado === 'APROBADA' || s.estado === 'RECHAZADA') && s.resuelto && (Date.now() - new Date(s.resuelto.replace(' ', 'T')).getTime()) < 14 * 864e5);
    let h = '<h1>Hola, ' + esc(me.nombre) + '</h1><p class="muted small" style="margin:0 0 14px">' + esc(me.centro) + '</p>';
    const dr = d.docs ? d.docs.resumen : null;
    if (dr && dr.firmar) h += '<button type="button" class="banner warn" style="display:block;width:100%;text-align:left;border:0;cursor:pointer" data-act="go" data-v="docs">Tienes <b>' + dr.firmar + ' documento' + (dr.firmar > 1 ? 's' : '') + ' para firmar</b>. Toca para leerlo y firmarlo ›</button>';
    if (dr && dr.rechazados.length) h += '<button type="button" class="banner err" style="display:block;width:100%;text-align:left;border:0;cursor:pointer" data-act="go" data-v="docs">Tienes que volver a subir: <b>' + esc(dr.rechazados.join(', ').toLowerCase()) + '</b> ›</button>';
    else if (dr && (dr.docs.length || dr.datos.length)) h += '<button type="button" class="banner info" style="display:block;width:100%;text-align:left;border:0;cursor:pointer" data-act="go" data-v="docs"><b>Completa tu alta</b>: ' + (dr.datos.length ? 'faltan datos personales' + (dr.docs.length ? ' y ' : '') : '') + (dr.docs.length ? dr.docs.length + ' documento' + (dr.docs.length > 1 ? 's' : '') : '') + '. Toca para completarla ›</button>';
    nomNuevas().slice(0, 1).forEach((n) => { h += '<button type="button" class="banner info" style="display:block;width:100%;text-align:left;border:0;cursor:pointer" data-act="openNom" data-id="' + esc(n.id) + '">' + (n.actualizada ? 'Se ha <b>actualizado tu nómina de ' + nomMes(n) + '</b>' : 'Ya tienes tu <b>nómina de ' + nomMes(n) + '</b>') + '. Toca para verla ›</button>'; });
    sinFirmar.forEach((w) => { h += '<button type="button" class="banner warn" style="display:block;width:100%;text-align:left;border:0;cursor:pointer" data-act="openWeek" data-id="' + esc(w.id) + '">Tienes el horario de la <b>' + wtag(w.semana) + '</b> (' + weekRange(w.anio, w.semana) + ') sin firmar. Toca para verlo y firmarlo ›</button>'; });
    resueltas.forEach((s) => { const m = motivo(s.tipo); h += '<div class="banner ' + (s.estado === 'APROBADA' ? 'ok' : 'err') + '">' + (s.estado === 'APROBADA' ? 'Te han aprobado ' : 'No te han aprobado ') + esc(m.nombre.toLowerCase()) + ' (' + fdate(s.desde) + (s.hasta !== s.desde ? ' – ' + fdate(s.hasta) : '') + ').' + (s.comentario ? ' «' + esc(s.comentario) + '»' : '') + '</div>'; });
    if (hoy.length) h += '<div class="card"><div class="small muted" style="font-weight:600">Hoy</div>' + shiftRows(hoy) + '</div>';
    h += '<div class="card"><div class="small muted" style="font-weight:600">' + (next ? 'Próximo turno · ' + (nextK === iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1)) ? 'mañana, ' : '') + DIAS[(new Date(nextK + 'T12:00:00').getDay() + 6) % 7].toLowerCase() + ' ' + fdate(nextK) : 'Próximo turno') + '</div>' +
      (next ? shiftRows(next) : '<p class="small muted" style="margin:8px 0 0">No tienes turnos en los horarios que te han enviado. Cuando te llegue el de la semana que viene, aparecerá aquí.</p>') + '</div>';
    void weekH;
    return h;
  }

      (w.firmado ? '<span class="pill ok">Firmado</span>' : '<span class="pill warn">Sin firmar</span>') + '<span class="chev" aria-hidden="true">›</span></button>').join('');

  function saldoCard(t, x, unit) {
    return '<div class="kpi"><span>' + t + '</span><b>' + fmtH(Math.max(0, x.disponible)) + '</b> <small>de ' + fmtH(x.total) + ' ' + unit + '</small>' +
      '<span style="margin-top:4px">' + fmtH(x.usados) + ' disfrutado' + (x.usados === 1 ? '' : 's') + (x.previstos ? ' · ' + fmtH(x.previstos) + ' aprobado' + (x.previstos === 1 ? '' : 's') : '') + (x.pendientes ? ' · ' + fmtH(x.pendientes) + ' pendiente' + (x.pendientes === 1 ? '' : 's') : '') + '</span></div>';

      '<button class="btn primary block" type="button" data-act="go" data-v="pedir">Pedir vacaciones o un permiso</button>';

    h += '<h2>Mis solicitudes</h2>';

      const m = motivo(x.tipo);
      return '<div class="card" style="padding:12px 14px"><div style="display:flex;align-items:center;gap:8px"><span class="mdot" style="background:' + esc(m.color) + '"></span><b style="flex:1">' + esc(m.nombre) + '</b>' + pillEstado(x.estado) + '</div>' +

    }).join('') : '<div class="card muted small">Todavía no has pedido nada desde el portal.</div>';

  function quedan(m) {
    const s = S.d.saldo;
    if (m.grupo === 'VAC') return s.vac.disponible;
    if (m.grupo === 'AP') return s.ap.disponible;
    return s.limites[m.id] ? s.limites[m.id].disponible : null;
  }
  function countDays(a, b, unidad) {
    let n = 0;
    for (let t = new Date(a + 'T12:00:00'), e = new Date(b + 'T12:00:00'); t <= e; t = new Date(t.getTime() + 864e5)) { const wd = t.getDay(); if (unidad === 'DIAS_LAB' && (wd === 0 || wd === 6)) continue; n++; }
    return n;
  }
  function vPedir() {
    S.adj = null;
    const ms = S.d.motivos;
    const tomorrow = iso(new Date(Date.now() + 864e5));
    let h = '<button class="btn sm" type="button" data-act="go" data-v="ausencias">‹ Vacaciones y permisos</button><h1 style="margin-top:12px">Pedir</h1>' +
      '<p class="muted small" style="margin:0 0 12px">Le llega a tu coordinador, que la aprueba o no. Te avisaremos por correo.</p><div class="card">' +
      '<label class="field"><span>Qué pides</span><select class="input" id="rqTipo" data-on="rq">' + ms.map((m) => '<option value="' + esc(m.id) + '">' + esc(m.nombre) + '</option>').join('') + '</select></label>' +
      '<div class="row2"><label class="field"><span>Desde</span><input class="input" type="date" id="rqDesde" value="' + tomorrow + '" min="' + esc(S.d.hoy) + '" data-on="rq"></label>' +
      '<label class="field"><span>Hasta</span><input class="input" type="date" id="rqHasta" value="' + tomorrow + '" min="' + esc(S.d.hoy) + '" data-on="rq"></label></div>' +
      '<div id="rqJust" class="field hidden"><span>Justificante <b class="req">obligatorio</b></span>' +
      '<label class="filebtn"><input type="file" id="rqFile" accept="image/*,application/pdf" data-on="rqf"><span class="fic" aria-hidden="true">📎</span><span id="rqFileName">Hacer una foto o elegir un archivo</span></label>' +
      '<span class="small muted" style="font-weight:400;display:block;margin-top:4px">Foto o PDF del documento (certificado de matrimonio, del hospital…).</span></div>' +
      '<label class="field"><span>Nota para tu coordinador (opcional)</span><textarea class="input" id="rqNotas" maxlength="400"></textarea></label>' +
      '<div id="rqInfo" class="banner info">…</div>' +
      '<button class="btn primary block" type="button" data-act="sendReq" id="rqBtn">Enviar solicitud</button></div>' +
      '<p class="small muted">Para una visita médica o una baja, habla directamente con tu coordinador.</p>';
    setTimeout(rqUpdate, 0);
    return h;
  }
  function rqUpdate() {
    const tipo = $('#rqTipo'), a = $('#rqDesde'), b = $('#rqHasta'), info = $('#rqInfo'), btn = $('#rqBtn');
    if (!tipo || !info) return;
    if (a.value && (!b.value || b.value < a.value)) b.value = a.value;
    const m = S.d.motivos.find((x) => x.id === tipo.value);
    const n = a.value && b.value ? countDays(a.value, b.value, m.unidad) : 0;
    const q = quedan(m);
    let ok = n > 0, txt;
    if (!a.value) { ok = false; txt = 'Elige las fechas.'; }
    else if (a.value < S.d.hoy) { ok = false; txt = 'No se pueden pedir días que ya han pasado.'; }
    else if (a.value.slice(0, 4) !== b.value.slice(0, 4)) { ok = false; txt = 'Si coge días de dos años, pídelo en dos solicitudes.'; }
    else if (!n) { ok = false; txt = 'En esas fechas no hay días laborables.'; }
    else {
      txt = (n === 1 ? 'Es <b>1 día' : 'Son <b>' + n + ' días') + (m.unidad === 'DIAS_LAB' ? (n === 1 ? ' laborable' : ' laborables') : '') + '</b>' + (m.unidad === 'DIAS_LAB' ? ' (de lunes a viernes)' : '') + '.';
      if (q !== null) {
        if (n > q + 0.001) { ok = false; txt += ' <b>' + (q <= 0 ? 'No te quedan días de ' + esc(m.nombre.toLowerCase()) + ' este año.' : 'Solo te quedan ' + fmtH(q) + '.') + '</b>'; }
        else txt += ' Te quedarían ' + fmtH(q - n) + '.';
      }
      if (m.grupo === 'AP') {
        const dd = Math.round((new Date(a.value + 'T00:00:00') - new Date(S.d.hoy + 'T00:00:00')) / 864e5);
        if (dd < 2) { ok = false; txt += ' <b>Los asuntos propios se piden con 48 horas de antelación.</b>'; }
      }
    }
    const jb = $('#rqJust');
    if (jb) jb.classList.toggle('hidden', !m.justificante);
    let onlyAdj = false;
    if (ok && m.justificante && !S.adj) { ok = false; onlyAdj = true; txt += ' <b>Adjunta el justificante para poder enviarla.</b>'; }
    info.className = 'banner ' + (ok ? 'info' : (onlyAdj ? 'warn' : 'err'));
    info.innerHTML = txt;
    btn.disabled = !ok;
  }

  /* ---------- Ver un documento (fotos y PDF, también en el móvil) ---------- */
  const LIBS = { pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js' };
  const loaded = {};
  function loadScript(src) {
    if (!loaded[src]) loaded[src] = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('No se ha podido cargar el visor. Revisa tu conexión.')); document.head.appendChild(sc); });

  }
  function b64ToBytes(b64) { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function bytesToB64(bytes) { let s = ''; const ch = 0x8000; for (let i = 0; i < bytes.length; i += ch) s += String.fromCharCode.apply(null, bytes.subarray(i, i + ch)); return btoa(s); }
  async function renderPdf(bytes, box) {
    await loadScript(LIBS.pdfjs);
    try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfjsWorker; } catch (e) { /* sin worker */ }
    const pdf = await window.pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    box.innerHTML = '';
    const W = Math.min(box.clientWidth || 340, 900);
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({ scale: 1 });
      const k = W / v1.width, dpr = Math.min(2, window.devicePixelRatio || 1);
      const vp = page.getViewport({ scale: k * dpr });

      box.appendChild(c);

  function vVerDoc() {

  let pad = null;
  function setupPad() {
    const c = $('#pad'); if (!c) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth, hgt = 190;
    c.width = w * dpr; c.height = hgt * dpr; c.style.height = hgt + 'px';
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B2545';

    c.onpointerdown = (ev) => { ev.preventDefault(); c.setPointerCapture(ev.pointerId); pad.down = true; const p0 = pos(ev); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p0[0] + 0.1, p0[1] + 0.1); ctx.stroke(); pad.strokes++; };

  function dateEs(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() + ' a las ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  /** Añade la hoja de firma y una línea al pie de cada página. */
  async function buildSigned(bytes, sigPng, x) {
    await loadScript(LIBS.pdflib);
    const L = window.PDFLib;
    const pdf = await L.PDFDocument.load(bytes, { ignoreEncryption: true });
    const font = await pdf.embedFont(L.StandardFonts.Helvetica), bold = await pdf.embedFont(L.StandardFonts.HelveticaBold);
    const me = S.d.me, now = new Date(), name = [me.nombre, me.apellido1, me.apellido2].filter(Boolean).join(' ');
    const pages = pdf.getPages(), total = pages.length + 1;
    pages.forEach((pg, i) => {
      pg.drawText('Firmado electrónicamente por ' + name + ' el ' + dateEs(now) + ' - página ' + (i + 1) + ' de ' + total + ' - ver hoja de firma', { x: 28, y: 12, size: 6.5, font: font, color: L.rgb(0.35, 0.4, 0.45) });
    });
    const pg = pdf.addPage([595.28, 841.89]);
    let y = 780;
    const line = (t, f, sz, col) => { pg.drawText(t, { x: 56, y: y, size: sz || 11, font: f || font, color: col || L.rgb(0.08, 0.09, 0.12), maxWidth: 480 }); y -= (sz || 11) + 9; };
    line('Hoja de firma', bold, 20); y -= 6;
    line('Documento: ' + x.titulo, bold, 12);

    line('Firmado por: ' + name);
    if (me.dni) line('DNI / NIE: ' + me.dni);
    line('Email verificado: ' + me.email);
    line('Fecha y hora: ' + dateEs(now));
    line('Huella del documento original (SHA-256):', font, 9, L.rgb(0.35, 0.4, 0.45));

    y -= 14;
    line('Firma:', bold, 12);
    const img = await pdf.embedPng(sigPng);
    const iw = 300, ih = iw * img.height / img.width;
    pg.drawRectangle({ x: 56, y: y - ih - 6, width: iw + 12, height: ih + 12, borderColor: L.rgb(0.8, 0.83, 0.86), borderWidth: 1 });
    pg.drawImage(img, { x: 62, y: y - ih, width: iw, height: ih });
    y -= ih + 40;
    line('Firma electrónica simple realizada desde el portal del trabajador de Areafit, después de comprobar el acceso', font, 9, L.rgb(0.35, 0.4, 0.45));
    line('con un enlace o código enviado a su email. Las ' + (total - 1) + ' páginas anteriores forman parte de este documento.', font, 9, L.rgb(0.35, 0.4, 0.45));
    return await pdf.save();
  }

    },
    logout() { if (!window.confirm('¿Cerrar la sesión en este móvil?')) return; store(KEY, null); S.sesion = null; S.d = null; menu(false); renderLogin(); },
    openWeek(el) { S.week = el.dataset.id; S.view = 'semana'; render(); },
    async sign(el) {
      el.disabled = true; el.textContent = 'Firmando…';
      try { const f = await call('portalSign', S.sesion, el.dataset.id); const w = S.d.horarios.find((x) => x.id === el.dataset.id); if (w) w.firmado = f || 'ahora'; render(); toast('Horario firmado. ¡Gracias!'); }
      catch (e) { el.disabled = false; el.textContent = 'Firmar: he recibido mi horario'; fail(e); }
    },
    async pdf(el) {
      const box = $('#pdfBox'); if (!box) return;
      if (box.innerHTML) { box.innerHTML = ''; el.textContent = 'Ver como PDF'; return; }
      el.disabled = true; el.textContent = 'Cargando…';
      try {
        const html = await call('portalScheduleHtml', S.sesion, el.dataset.id);
        const W = box.clientWidth || 340, k = Math.min(1, W / 794);
        box.innerHTML = '<div class="frame" style="height:' + Math.round(1060 * k) + 'px;overflow:hidden"><iframe title="Horario en PDF" style="transform:scale(' + k + ')"></iframe></div>';
        box.querySelector('iframe').srcdoc = html;
        el.textContent = 'Ocultar el PDF';
      } catch (e) { el.textContent = 'Ver como PDF'; fail(e); }
      el.disabled = false;
    },
    openSign(el) { S.sign = el.dataset.id; S.view = 'firmar'; render(); },
    viewDoc(el) { const x = S.d.docs.lista.find((y) => y.id === el.dataset.id); if (!x) return; S.doc = { id: x.id, titulo: x.titulo, firmado: false }; S.view = 'verdoc'; render(); },
    openNom(el) {
      const N = S.d.nominas;
      S.nomId = el.dataset.id;
      S.view = N && N.acepta ? 'vernom' : 'nominas';
      menu(false); render();
    },
    async nomAcepta(el) {
      el.disabled = true;
      try { S.d.nominas.acepta = await call('portalAceptarNominas', S.sesion); S.view = S.nomId ? 'vernom' : 'nominas'; render(); toast('¡Hecho! Ya puedes ver tus nóminas.'); }
      catch (e) { el.disabled = false; fail(e); }
    },
    dlNom() {
      const f = S.nomFile; if (!f) return;
      const url = URL.createObjectURL(new Blob([b64ToBytes(f.data)], { type: 'application/pdf' }));
      const a = document.createElement('a'); a.href = url; a.download = f.nombre; document.body.appendChild(a); a.click(); a.remove();
    },
    async dlDoc(el) {
      el.disabled = true;
      try {
        const f = await call('portalGetDoc', S.sesion, el.dataset.id, true);
        const url = URL.createObjectURL(new Blob([b64ToBytes(f.data)], { type: f.mime }));
        const a = document.createElement('a'); a.href = url; a.download = f.nombre; document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { fail(e); }
      el.disabled = false;
    },
    padClear() { if (pad) { pad.ctx.clearRect(0, 0, pad.c.width, pad.c.height); pad.strokes = 0; } },
    async signDoc(el) {
      const x = S.d.docs.lista.find((y) => y.id === S.sign);
      if (!x || !S.signFile || S.signFile.id !== x.id) { toast('Espera a que se abra el documento.', true); return; }
      if (!pad || pad.strokes < 1) { toast('Firma con el dedo dentro del recuadro.', true); return; }
      if (!$('#signOk').checked) { toast('Marca la casilla de que lo has leído.', true); return; }
      el.disabled = true; el.textContent = 'Firmando…';
      try {
        const signed = await buildSigned(b64ToBytes(S.signFile.data), pad.c.toDataURL('image/png'), x);
        S.d = await call('portalSignDoc', S.sesion, x.id, bytesToB64(signed), { ua: navigator.userAgent });
        S.signFile = null; S.view = 'docs'; render(); toast('Documento firmado. Lo tienes en «Documentos firmados».');
      } catch (e) { el.disabled = false; el.textContent = 'Firmar'; fail(e); }
    },
    async savePersonal(el) {
      const d = { dni: $('#pdDni').value, fecha_nacimiento: $('#pdNac').value, direccion: $('#pdDir').value, cp: $('#pdCp').value, localidad: $('#pdLoc').value,
        provincia: $('#pdProv').value, nss: $('#pdNss').value, iban: ($('#pdIban').value || '').replace(/\s+/g, '') };
      const old = (S.d.me.iban || '').replace(/\s+/g, '').toUpperCase();
      if (old && d.iban.toUpperCase() !== old && !S.pdTit) { toast('Has cambiado el IBAN: adjunta el certificado de titularidad de la cuenta nueva.', true); return; }
      el.disabled = true; el.textContent = 'Guardando…';
      try { S.d = await call('portalSavePersonal', S.sesion, d, S.pdTit); S.pdTit = null; render(); toast('Datos guardados.'); }
      catch (e) { el.disabled = false; el.textContent = 'Guardar mis datos'; fail(e); }
    },
    async sendReq(el) {
      el.disabled = true; el.textContent = 'Enviando…';
      const m = S.d.motivos.find((x) => x.id === $('#rqTipo').value);
      const r = { tipo: $('#rqTipo').value, desde: $('#rqDesde').value, hasta: $('#rqHasta').value, notas: $('#rqNotas').value, adjunto: m && m.justificante ? S.adj : null };
      try { S.d = await call('portalRequest', S.sesion, r); S.adj = null; S.view = 'ausencias'; render(); toast('Solicitud enviada a tu coordinador.'); }
      catch (e) { el.disabled = false; el.textContent = 'Enviar solicitud'; fail(e); }
    },
    async cancel(el) {
      if (!window.confirm('¿Anular esta solicitud?')) return;
      el.disabled = true;
      try { S.d = await call('portalCancel', S.sesion, el.dataset.id); render(); toast('Solicitud anulada.'); } catch (e) { el.disabled = false; fail(e); }
    },
    async saveMe(el) {
      el.disabled = true; el.textContent = 'Guardando…';
      const d = { email: $('#mdEmail').value.trim(), telefono: $('#mdTel').value.trim(), talla_camiseta: $('#mdTc').value.trim(), talla_pantalon: $('#mdTp').value.trim(), talla_calzado: $('#mdTz').value.trim() };
      try { const r = await call('portalSaveMe', S.sesion, d); S.sesion = r.sesion; store(KEY, r.sesion); S.d.me = r.me; render(); toast('Datos guardados.'); }
      catch (e) { el.disabled = false; el.textContent = 'Guardar'; fail(e); }
    }
  };
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', (ev) => { if (ev.target.dataset && ev.target.dataset.on === 'rq') rqUpdate(); });
  document.addEventListener('change', (ev) => {
    if (ev.target.dataset && ev.target.dataset.on === 'rq') rqUpdate();
    if (ev.target.dataset && ev.target.dataset.on === 'rqf') readFile(ev.target.files && ev.target.files[0]);
    if (ev.target.dataset && ev.target.dataset.on === 'docUp') {
      const tipo = ev.target.dataset.tipo, f = ev.target.files && ev.target.files[0];
      if (!f) return;
      toast('Subiendo…');
      prepFile(f).then((adj) => call('portalUploadDoc', S.sesion, tipo, adj)).then((d) => { S.d = d; render(); toast('Subido. Tu coordinador lo revisará.'); }).catch(fail);
    }
    if (ev.target.dataset && ev.target.dataset.on === 'pdTit') {
      const f = ev.target.files && ev.target.files[0], nm = $('#pdTitName');
      if (!f) return;
      if (nm) nm.textContent = 'Preparando…';
      prepFile(f).then((adj) => { S.pdTit = adj; if (nm) nm.textContent = '✓ ' + adj.name; }).catch((e) => { if (nm) nm.textContent = 'Hacer una foto o elegir un archivo'; fail(e); });
    }
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'pdIban') {
      const old = (S.d.me.iban || '').replace(/\s+/g, '').toUpperCase(), now = ev.target.value.replace(/\s+/g, '').toUpperCase();
      const b = $('#pdTit'); if (b) b.classList.toggle('hidden', !old || now === old);
    }
  });
  /** Prepara el justificante: las fotos se reducen (máx. 1600 px, JPEG); los PDF van tal cual. */
  /** Lee un archivo: las fotos se reducen (máx. 1800 px, JPEG); los PDF van tal cual. */
  function prepFile(f) {
    return new Promise((resolve, reject) => {
      if (!f) { reject(new Error('Elige un archivo.')); return; }
      if (f.size > 12 * 1024 * 1024) { reject(new Error('El archivo pesa demasiado. Prueba con una foto.')); return; }
      const rd = new FileReader();
      rd.onerror = () => reject(new Error('No se ha podido leer el archivo.'));
      rd.onload = () => {
        if (f.type === 'application/pdf') { resolve({ name: f.name, mime: 'application/pdf', data: String(rd.result).split(',')[1] }); return; }
        const img = new Image();
        img.onerror = () => reject(new Error('Ese archivo no es una foto ni un PDF.'));
        img.onload = () => {
          const k = Math.min(1, 1800 / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve({ name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
  }
  function readFile(f) {
    S.adj = null;
    const nameEl = $('#rqFileName');
    if (!f) { if (nameEl) nameEl.textContent = 'Hacer una foto o elegir un archivo'; rqUpdate(); return; }
    if (f.size > 12 * 1024 * 1024) { toast('El archivo pesa demasiado. Prueba con una foto.', true); rqUpdate(); return; }
    if (nameEl) nameEl.textContent = 'Preparando ' + f.name + '…';
    const rd = new FileReader();
    rd.onerror = () => { toast('No se ha podido leer el archivo.', true); };
    rd.onload = () => {
      if (f.type === 'application/pdf') { S.adj = { name: f.name, mime: 'application/pdf', data: String(rd.result).split(',')[1] }; done(); return; }
      const img = new Image();
      img.onerror = () => { toast('Ese archivo no es una foto ni un PDF.', true); if (nameEl) nameEl.textContent = 'Hacer una foto o elegir un archivo'; rqUpdate(); };
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        S.adj = { name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
        done();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
    function done() { if (nameEl) nameEl.textContent = '✓ ' + S.adj.name; rqUpdate(); }
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') menu(false);
    if (ev.key === 'Enter' && ev.target.id === 'lgEmail') ACT.sendLink($('#lgBtn'));
    if (ev.key === 'Enter' && ev.target.id === 'lgCode') ACT.codeLogin($('#lgCodeBtn'));
  });

  /* ---------- Arranque ---------- */
  async function boot() {
    if (ACESO_OK()) {
      try {
        const r = await call('portalLogin', ACCESO);
        S.sesion = r.sesion; store(KEY, r.sesion);
        try { if (IN_GOOGLE) google.script.history.replace(null, { portal: '1' }); else history.replaceState(null, '', location.pathname); } catch (e) { /* no pasa nada */ }
      } catch (e) { renderLogin(msg(e)); return; }
    } else if (HORARIO) {
      try {
        const r = await call('portalOpenHorario', HORARIO);
        S.sesion = r.sesion; store(KEY, r.sesion);
        S.openWeek = { anio: r.anio, semana: r.semana };
      } catch (e) {
        // Si el botón ha caducado pero ya tenía la sesión abierta en este navegador, entra igual
        S.sesion = load(KEY);
        if (!S.sesion) { try { history.replaceState(null, '', location.pathname); } catch (er) { /* nada */ } renderLogin(msg(e).replace(/^CADUCADO:\s*/, '')); return; }
      }
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* no pasa nada */ }
    } else S.sesion = load(KEY);
    if (!S.sesion) { renderLogin(); return; }
    refresh();
  }
  function ACESO_OK() { return !!ACCESO; }
  boot();
})();
</script>
